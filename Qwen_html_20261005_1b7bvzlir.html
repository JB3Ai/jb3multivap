<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multivap Solutions Intro</title>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .intro-container { display: flex; align-items: center; gap: 20px; opacity: 0; transform: scale(0.9); }
        
        /* Gear Animation */
        .gear { width: 80px; height: 80px; fill: white; animation: spinGear 3s ease-out forwards; }
        @keyframes spinGear { 
            0% { transform: rotate(-45deg) scale(0); opacity: 0; }
            60% { transform: rotate(10deg) scale(1.05); opacity: 1; }
            100% { transform: rotate(0deg) scale(1); opacity: 1; }
        }

        /* Text Animation */
        .text-group { font-family: 'Arial', sans-serif; color: white; }
        .brand-name { font-size: 48px; font-weight: bold; letter-spacing: 1px; clip-path: inset(0 100% 0 0); animation: revealText 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .sub-text { font-size: 16px; letter-spacing: 6px; margin-top: 5px; opacity: 0; animation: fadeInSub 3s 1.5s ease-out forwards; }
        
        @keyframes revealText { 0% { clip-path: inset(0 100% 0 0); } 100% { clip-path: inset(0 0 0 0); } }
        @keyframes fadeInSub { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Final Fade Out for Website Transition */
        .intro-container { animation: containerFadeIn 3s forwards; }
        @keyframes containerFadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="intro-container">
        <!-- Simplified Gear SVG -->
        <svg class="gear" viewBox="0 0 100 100">
            <path d="M50 10 L58 22 L72 18 L74 32 L88 36 L82 48 L92 58 L80 64 L82 78 L68 76 L62 88 L54 78 L42 82 L40 70 L26 66 L32 54 L22 44 L34 38 L32 24 L46 26 Z M50 30 A20 20 0 1 0 50 70 A20 20 0 1 0 50 30 Z"/>
            <text x="50" y="58" text-anchor="middle" fill="black" font-size="28" font-weight="bold" font-family="serif">M</text>
        </svg>
        <div class="text-group">
            <div class="brand-name">multivap</div>
            <div class="sub-text">SOLUTIONS</div>
        </div>
    </div>
</body>
</html>
